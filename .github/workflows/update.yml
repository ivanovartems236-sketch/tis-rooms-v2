name: Обновление расписания

on:
  schedule:
    # расписание выкладывают раз в 1–2 недели, правки — редко: дважды в день хватает
    - cron: "5 4,16 * * 1-6"   # 07:05 и 19:05 МСК, пн–сб (GitHub может запустить с опозданием)
    - cron: "5 15 * * 0"       # воскресенье 18:05 МСК — на случай выкладки новой недели
  workflow_dispatch:            # кнопка «Run workflow»

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 pytest==8.4.2
      - name: Тесты парсера
        run: python -m pytest -q
      - name: Собрать расписание
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_ADMIN: ${{ secrets.TG_ADMIN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/build.py
      - name: Сохранить
        run: |
          git config user.name "rasp-bot"
          git config user.email "rasp-bot@users.noreply.github.com"
          git add data.json changes.json ics
          git diff --cached --quiet || (git commit -q -m "Расписание обновлено" && git push)
