<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабинеты ТИС — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Прототип «Моё расписание сначала»: онбординг → Сегодня / Неделя / Найти / Ещё (нижняя панель) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --muted:#5f6b78; --line:#dde3ea;
  --accent:#1d5fa8; --accent-fg:#ffffff; --accent-soft:#e3edf8;
  --now:#c2410c; --now-soft:#fdeee5; --lab:#2f7d4f; --lab-soft:#e2f2e8; --warn:#a16207; --warn-soft:#fdf3d8;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#171e27; --fg:#e6ebf1; --muted:#97a3b0; --line:#28323e;
  --accent:#7fb2ec; --accent-fg:#0f141a; --accent-soft:#1a2b40;
  --now:#fb923c; --now-soft:#3a2416; --lab:#6fcf97; --lab-soft:#183324; --warn:#facc15; --warn-soft:#3a3214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#171e27; --fg:#e6ebf1; --muted:#97a3b0; --line:#28323e;
  --accent:#7fb2ec; --accent-fg:#0f141a; --accent-soft:#1a2b40;
  --now:#fb923c; --now-soft:#3a2416; --lab:#6fcf97; --lab-soft:#183324; --warn:#facc15; --warn-soft:#3a3214; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.app{max-width:520px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom,0px))}

/* шапка с профилями */
.top{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.profiles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.profiles::-webkit-scrollbar{display:none}
.prof{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.prof small{font-weight:400;color:var(--muted);margin-left:4px}
.prof[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.prof[aria-pressed="true"] small{color:inherit;opacity:.7}
.prof.add{color:var(--accent);border-style:dashed}

/* карточка «сейчас / следующая» */
.hero{background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.hero.now{background:var(--now)}
.hero.calm{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.hero .lbl{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.hero .room{font-family:var(--f-mono);font-size:2.6rem;font-weight:600;line-height:1.1;margin:6px 0 2px}
.hero .subj{font-size:1.05rem;font-weight:600;line-height:1.3}
.hero .meta{font-size:.88rem;opacity:.85;margin-top:4px}
.hero .bar{height:6px;background:color-mix(in srgb,currentColor 25%,transparent);border-radius:99px;margin-top:12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:currentColor;border-radius:99px}

/* дни */
.days{display:grid;grid-template-columns:28px repeat(6,1fr) 28px;gap:4px;align-items:center;margin-bottom:12px}
.days button{border:0;background:none;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.days .w{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.days .n{font-weight:700;font-size:1.05rem}
.days button.today .n{color:var(--accent)}
.days button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.days button[aria-pressed="true"] .w,.days button[aria-pressed="true"] .n{color:inherit}
.days button.has::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;margin-top:3px}
.days .arr{color:var(--muted);font-size:1.1rem}

h2{font-size:1.15rem;margin:4px 0 10px}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}

/* пары */
.lesson{display:grid;grid-template-columns:52px 1fr;gap:10px;margin-bottom:8px}
.lesson .t{font-family:var(--f-mono);font-size:.82rem;text-align:right;padding-top:12px;line-height:1.25}
.lesson .t b{display:block;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.card .s{font-weight:600;line-height:1.3}
.card .who{font-size:.85rem;color:var(--muted);margin-top:3px}
.card .r{font-family:var(--f-mono);font-weight:600;color:var(--fg)}
.lesson.past{opacity:.5}
.lesson.cur .card{border-color:var(--now);box-shadow:inset 3px 0 0 var(--now)}
.lesson.cancel .card{background:transparent;border-style:dashed}
.lesson.cancel .s{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.chip.k3{background:var(--lab-soft);color:var(--lab)}
.chip.chg{background:var(--warn-soft);color:var(--warn)}
.chip.nw{background:var(--now-soft);color:var(--now)}
.gap{margin:2px 0 10px 62px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.gap::before{content:"";flex:none;width:18px;border-top:1px dashed var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit}

/* неделя */
.wday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.wday.today{border-color:var(--accent)}
.wday .hd{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:4px;background:none;border:0;padding:0;width:100%;text-align:left}
.wday .hd span{font-weight:400;font-size:.8rem;color:var(--muted)}
.wrow{display:grid;grid-template-columns:18px 44px 1fr auto;gap:8px;font-size:.88rem;padding:3px 0;align-items:baseline}
.wrow .p{color:var(--muted);font-family:var(--f-mono)}
.wrow .tm{font-family:var(--f-mono);color:var(--muted);font-size:.8rem}
.wrow .sj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .rm{font-family:var(--f-mono);font-weight:600}

/* поиск */
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:1rem}
.res{display:flex;flex-direction:column;gap:6px}
.res button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res button small{color:var(--muted);flex:none}
.big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.big .ic{font-size:1.6rem;flex:none;width:36px;text-align:center}
.big b{display:block}
.big span{font-size:.85rem;color:var(--muted)}
.big.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.big.primary span{color:inherit;opacity:.85}
.pairs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.pairs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:.85rem;line-height:1.2;text-align:center}
.pairs button small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.72rem}
.pairs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pairs button[aria-pressed="true"] small{color:inherit}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.rooms button{background:var(--lab-soft);color:var(--fg);border:1px solid transparent;border-radius:12px;padding:8px 10px;text-align:left}
.rooms button b{font-family:var(--f-mono);display:block}
.rooms button small{color:var(--muted);font-size:.75rem}
.viewing{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 10px 8px 14px;margin-bottom:12px;font-size:.9rem}
.viewing b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.85rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* изменения */
.chg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:.88rem}
.chg .w{font-size:.78rem;color:var(--muted)}
.chg del{color:var(--muted)}
.chg ins{text-decoration:none;font-weight:600}

/* онбординг */
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.onb h1{font-size:1.7rem;line-height:1.15;margin:0 0 6px}
.onb p{color:var(--muted);margin:0 0 22px}

/* нижняя панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar div{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;width:100%}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;color:var(--muted);position:relative}
.tabbar button .i{font-size:1.25rem;line-height:1}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 8px);background:var(--now);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px;font-weight:700}
.foot{font-size:.78rem;color:var(--muted);margin-top:20px}
.demo{font-size:.75rem;color:var(--muted);text-align:center;margin:-4px 0 10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" hidden><div id="tabs"></div></nav>
<script>
"use strict";
/* Всё из расписания выводится только через textContent (helper h) */
const KN = ["", "Лекция", "Практика", "Лаб."];
const WD = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];
const WDL = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
const TYPE = { group: "группа", teacher: "преп.", room: "ауд." };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const wdi = d => (d.getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dm = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`;
const mins = t => { const m = /(\d{1,2})\.(\d{2})-(\d{1,2})\.(\d{2})/.exec(t || ""); return m ? [m[1] * 60 + +m[2], m[3] * 60 + +m[4]] : null; };
const hm = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const dur = m => (m >= 60 ? Math.floor(m / 60) + " ч " : "") + (m % 60 ? (m % 60) + " мин" : "");
const splitT = s => s.split("/").map(x => x.trim()).filter(Boolean);
const roomName = r => r === "СЗ" ? "Спортзал" : r;
const roomSort = (a, b) => { const pa = /^([^\d-]*)-?(\d*)/.exec(a), pb = /^([^\d-]*)-?(\d*)/.exec(b); return pa[1] === pb[1] ? (+pa[2] || 0) - (+pb[2] || 0) : pa[1].localeCompare(pb[1], "ru"); };
function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* демо-время: ?now=2026-10-27T10:20 — чтобы посмотреть «идёт пара» в любой момент */
const NOWP = new URLSearchParams(location.search).get("now");
const now = () => NOWP ? new Date(NOWP) : new Date();
const today = () => { const d = now(); d.setHours(0, 0, 0, 0); return d; };
const nowMin = () => { const d = now(); return d.getHours() * 60 + d.getMinutes(); };

/* ---------- данные ---------- */
let L = [], byDate = new Map(), lists = { group: [], teacher: [], room: [] }, CH = [], ICS = {}, UPDATED = "", MAXD = "";
function ingest(data) {
  const S = data.dict;
  L = data.l.map(r => ({ d: S[r[0]], p: r[1], t: S[r[2]], g: S[r[3]], k: r[4], s: S[r[5]], te: S[r[6]], r: S[r[7]], tl: splitT(S[r[6]]) }));
  const gs = new Set(), ts = new Set(), rs = new Set();
  byDate = new Map();
  for (const l of L) {
    (byDate.get(l.d) || byDate.set(l.d, []).get(l.d)).push(l);
    gs.add(l.g); l.tl.forEach(t => ts.add(t)); if (l.r) rs.add(l.r);
  }
  lists.group = [...gs].sort((a, b) => a.localeCompare(b, "ru"));
  lists.teacher = [...ts].sort((a, b) => a.localeCompare(b, "ru"));
  lists.room = [...rs].sort(roomSort);
  ICS = data.ics || {}; UPDATED = data.updated || "";
  MAXD = [...byDate.keys()].sort().pop() || "";
}
const match = (l, e) => e.type === "group" ? l.g === e.v : e.type === "teacher" ? l.tl.includes(e.v) : l.r === e.v;
function dayItems(date, e) {
  const agg = new Map();
  for (const l of byDate.get(date) || []) {
    if (!match(l, e)) continue;
    const k = [l.p, l.s, l.te, l.r, l.k].join("|");
    if (!agg.has(k)) agg.set(k, { ...l, gs: [], m: mins(l.t) });
    const a = agg.get(k); if (!a.gs.includes(l.g)) a.gs.push(l.g);
  }
  return [...agg.values()].sort((a, b) => a.p - b.p);
}
const chTouches = (c, e) => c.type === "lesson" && (e.type === "group" ? c.g.includes(e.v)
  : [c.before, c.after].some(x => x && (e.type === "room" ? x.r === e.v : splitT(x.t).includes(e.v))));
function changesFor(date, e) { return CH.filter(c => c.d === date && chTouches(c, e)); }
function pairTimes(date) {
  const cnt = {};
  for (const l of byDate.get(date) || []) (cnt[l.p] ||= {})[l.t] = (cnt[l.p][l.t] || 0) + 1;
  const out = {}; for (const p in cnt) out[p] = Object.entries(cnt[p]).sort((a, b) => b[1] - a[1])[0][0];
  return out;
}

/* ---------- состояние ---------- */
const st = {
  profiles: ls("proto-profiles") || [],
  cur: ls("proto-cur") || 0,
  tab: "today", view: null, date: today(), onb: null, q: "", freePair: null,
};
const me = () => st.view || st.profiles[st.cur] || null;
function saveProfiles() { ls("proto-profiles", st.profiles); ls("proto-cur", st.cur); }
function addProfile(e, makeCur = true) {
  let i = st.profiles.findIndex(p => p.type === e.type && p.v === e.v);
  if (i < 0) { st.profiles.push(e); i = st.profiles.length - 1; }
  if (makeCur) st.cur = i;
  st.view = null; saveProfiles();
}
const go = (tab, extra) => { Object.assign(st, { tab }, extra || {}); render(); scrollTo(0, 0); };

/* ---------- онбординг ---------- */
function viewOnboarding() {
  if (!st.onb) return [h("div", { class: "onb" },
    h("h1", {}, "Кабинеты ТИС"),
    h("p", {}, "Расписание за 2 тапа. Без регистрации — выбор хранится только на этом телефоне."),
    h("button", { class: "big primary", onclick: () => { st.onb = "group"; render(); } }, h("span", { class: "ic" }, "🎓"), h("div", {}, h("b", {}, "Я студент"), h("span", {}, "Расписание моей группы"))),
    h("button", { class: "big", onclick: () => { st.onb = "teacher"; render(); } }, h("span", { class: "ic" }, "👩‍🏫"), h("div", {}, h("b", {}, "Я преподаватель"), h("span", {}, "Мои пары и окна"))),
    h("button", { class: "big", onclick: () => { st.onb = "skip"; ls("proto-skip", 1); go("find"); } }, h("span", { class: "ic" }, "🔍"), h("div", {}, h("b", {}, "Просто посмотреть"), h("span", {}, "Аудитории, свободные кабинеты, любая группа"))),
    h("p", { class: "foot" }, "Неофициальный сервис. Данные — stis.su/schedule."))];
  const type = st.onb, q = st.q.toLowerCase();
  const found = lists[type].filter(v => v.toLowerCase().includes(q)).slice(0, 40);
  const input = h("input", { placeholder: type === "group" ? "Например, Исп-9-251" : "Фамилия", value: st.q, autocomplete: "off", spellcheck: "false",
    oninput: e => { st.q = e.target.value; renderKeepFocus(); } });
  return [h("div", { style: "padding-top:24px" },
    h("button", { class: "link", onclick: () => { st.onb = null; st.q = ""; render(); } }, "← назад"),
    h("h2", { style: "margin-top:12px" }, type === "group" ? "Найди свою группу" : "Найди себя"),
    h("div", { class: "search" }, input),
    h("div", { class: "res" }, found.map(v => h("button", { onclick: () => { addProfile({ type, v }); st.onb = null; st.q = ""; go("today", { date: today() }); } }, h("b", {}, v), h("small", {}, TYPE[type])))),
    found.length ? null : h("div", { class: "empty" }, "Ничего не нашлось"))];
}

/* ---------- шапка профилей ---------- */
function profileBar() {
  return h("div", { class: "top" }, h("div", { class: "profiles" },
    st.profiles.map((p, i) => h("button", { class: "prof", "aria-pressed": !st.view && i === st.cur ? "true" : "false",
      onclick: () => { st.cur = i; st.view = null; saveProfiles(); render(); } }, p.type === "room" ? roomName(p.v) : p.v, h("small", {}, TYPE[p.type]))),
    h("button", { class: "prof add", onclick: () => go("find") }, "+ добавить")));
}
function viewingBar() {
  if (!st.view) return null;
  return h("div", { class: "viewing" }, h("b", {}, "Смотришь: " + (st.view.type === "room" ? roomName(st.view.v) : st.view.v)),
    h("button", { class: "btn primary", onclick: () => addProfile(st.view, false) || render() }, "★ Сохранить"),
    h("button", { class: "btn", "aria-label": "Закрыть", onclick: () => { st.view = null; render(); } }, "✕"));
}

/* ---------- Сегодня ---------- */
function nextSchoolDay(from, e) {
  for (let d = addDays(from, 1), i = 0; i < 14; i++, d = addDays(d, 1)) { const it = dayItems(iso(d), e); if (it.length) return [d, it]; }
  return [null, []];
}
function hero(e) {
  const t = iso(today()), items = dayItems(t, e), m = nowMin();
  const cur = items.find(i => i.m && m >= i.m[0] && m < i.m[1]);
  const next = items.find(i => i.m && i.m[0] > m);
  const place = i => e.type === "room" ? (i.gs.length > 2 ? i.gs.length + " групп" : i.gs.join(", ")) : roomName(i.r || "без ауд.");
  const sub = i => [i.s, e.type === "teacher" ? i.gs.join(", ") : e.type === "group" ? i.te : i.te].filter(Boolean).join(" · ");
  if (cur) {
    const left = cur.m[1] - m, pct = 100 * (m - cur.m[0]) / (cur.m[1] - cur.m[0]);
    return h("div", { class: "hero now" }, h("div", { class: "lbl" }, `Идёт ${cur.p} пара · ещё ${dur(left)}`),
      h("div", { class: "room" }, place(cur)), h("div", { class: "subj" }, cur.s),
