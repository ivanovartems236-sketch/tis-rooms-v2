name: Обновление расписания

on:
  schedule:
    - cron: "5 3-17 * * 1-6"   # каждый час 06:05–20:05 МСК, пн–сб
    - cron: "5 15 * * 0"       # воскресенье 18:05 МСК — на случай выкладки новой недели
  workflow_dispatch:            # кнопка «Run workflow»

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Собрать расписание
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/build.py
      - name: Сохранить
        run: |
          git config user.name "rasp-bot"
          git config user.email "rasp-bot@users.noreply.github.com"
          git add data.json changes.json ics
          git diff --cached --quiet || (git commit -q -m "Расписание обновлено" && git push)
